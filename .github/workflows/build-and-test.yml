name: Build and Test

on:
- push
- pull_request

jobs:
  build:
    runs-on:

    - self-hosted
    - tower
    - ubuntu-latest
    - tower-run-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: "14"
    - run: yarn install --frozen-lockfile
    - run: yarn build
    - run: yarn test
    - run: yarn check-format
    - run: yarn lint
